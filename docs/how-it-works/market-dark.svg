  <rect x="990" y="490" width="850" height="230" rx="24" fill="#101814" stroke="#25322C" stroke-width="2"/>
  <text x="1022" y="538" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#5CFF63">Bitta klinika · oyiga</text>
  <text x="1022" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" fill="#F2F7F4">$500</text>
  <text x="1022" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#9AA8A2">narx</text>
  <text x="1300" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" fill="#F2F7F4">$40–50</text>
  <text x="1300" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#9AA8A2">xarajat</text>
  <text x="1578" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" fill="#5CFF63">$450+</text>
  <text x="1578" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#9AA8A2">foyda · marja ~90%</text>

  <!-- SOM result card -->
  <rect x="990" y="750" width="850" height="230" rx="24" fill="#5CFF63"/>
  <text x="1022" y="798" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#04130A">SOM natijasi · 30 klinika</text>
  <text x="1022" y="880" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="700" fill="#04130A">$15 000</text>
  <text x="1022" y="924" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#04130A">daromad / oy</text>
  <text x="1290" y="880" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="700" fill="#04130A">~$13 700</text>
  <text x="1290" y="924" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#04130A">foyda / oy</text>
  <text x="1610" y="880" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="700" fill="#04130A">$180K</text>
  <text x="1610" y="924" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#04130A">daromad / yil</text>

  <!-- Footnote -->
  <text x="80" y="1040" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7A73">Jamoa hisob-kitobi · $500 / oy obuna asosida · taxminiy, pilotda tekshiriladi</text>
</svg>
