  <text x="1022" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#5CFF63">Yo‘l xaritasi</text>
  <rect x="1022" y="320" width="240" height="108" rx="18" fill="#081A26" stroke="#38BDF8" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1142" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#F2F7F4">Pilot</text>
  <text x="1142" y="396" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#9AA8A2">1–2 oy · bepul</text>
  <polygon points="1286,370 1300,374 1286,378" fill="#9AA8A2"/>
  <line x1="1268" y1="374" x2="1288" y2="374" stroke="#9AA8A2" stroke-width="2"/>
  <rect x="1310" y="320" width="240" height="108" rx="18" fill="#0E2414" stroke="#1E6E25" stroke-width="2"/>
  <text x="1430" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#F2F7F4">30 klinika</text>
  <text x="1430" y="396" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#9AA8A2">Namangan</text>
  <polygon points="1574,370 1588,374 1574,378" fill="#9AA8A2"/>
  <line x1="1556" y1="374" x2="1576" y2="374" stroke="#9AA8A2" stroke-width="2"/>
  <rect x="1598" y="320" width="210" height="108" rx="18" fill="#5CFF63"/>
  <text x="1703" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#04130A">O‘zbekiston</text>
  <text x="1703" y="396" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#04130A">9 000+ klinika</text>

