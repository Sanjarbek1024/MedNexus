    <tspan x="1570" dy="34">chiqadi va imzolaydi</tspan>
  </text>

  <!-- Grouping brackets -->
  <path d="M412 880V896H700V880M556 896V908" fill="none" stroke="#5B6B64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
