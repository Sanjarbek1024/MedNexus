  <text x="1114" y="944" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0C1A14">AI modellar</text>
  <text x="1114" y="976" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#5B6B64">DenseNet-121 + ResNet-50 · YOLOv7 · ViT-B/16 · Qwen VLM · gpt-oss-120b</text>

  <path d="M1544 880V896H1832V880M1688 896V908" fill="none" stroke="#5B6B64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1688" y="944" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0C1A14">Inson nazorati</text>
  <text x="1688" y="976" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#5B6B64">SHA-256 audit zanjiri</text>
