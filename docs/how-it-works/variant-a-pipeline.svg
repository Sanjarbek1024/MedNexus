  <rect x="80" y="524" width="288" height="316" rx="24" fill="#F6F8F7" stroke="#E3E8E6" stroke-width="2"/>
  <circle cx="128" cy="574" r="22" fill="#07110B"/>
  <text x="128" y="582" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#5CFF63">1</text>
