# MedNexus with PostgreSQL: http://localhost:8080 (API docs: http://localhost:8000/docs).
# Variables come from ./.env: copy .env.example and set SECRET_KEY and PSEUDONYM_KEY first.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mednexus
      POSTGRES_USER: mednexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mednexus-local}
    volumes:
      - mednexus-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mednexus -d mednexus"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://mednexus:${POSTGRES_PASSWORD:-mednexus-local}@db:5432/mednexus
      DATA_DIR: /app/data
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
      PSEUDONYM_KEY: ${PSEUDONYM_KEY:?Set PSEUDONYM_KEY in .env (see .env.example)}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      # Browsers accept Secure cookies on http://localhost; set false only for plain http elsewhere.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: '["http://localhost:8080", "http://127.0.0.1:8080"]'
    volumes:
      - mednexus-data:/app/data  # uploaded studies
      # Demo data (after scripts/download_samples.py): docker compose exec backend python scripts/seed_demo.py
      - ./scripts:/app/scripts:ro
      - ./samples:/app/samples
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"  # API docs; the web app reaches the API through nginx

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mednexus-db:
  mednexus-data:
