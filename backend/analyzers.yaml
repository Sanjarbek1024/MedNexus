# Analyzer registry.
#
# `taxonomy` lists every modality, body region and view the UI offers.
# `analyzers` lists the plugins. Each entry names a Python class (module:Class), the
# studies it applies to (omitted keys match anything) and its constructor params.
# For a study, every analyzer that applies runs; quality gates run first, and a failed
# blocking check stops the pipeline. A combination is "supported" when at least one
# findings-producing analyzer applies to it; everything else shows as "Coming soon".
#
# Adding a model = one Analyzer subclass + one entry below. No frontend changes.

taxonomy:
  modalities:
    - {id: xray, label: X-ray, views: [PA, AP, Lateral]}
    - {id: ct, label: CT, views: [Axial, Coronal, Sagittal]}
    - {id: mri, label: MRI, views: [Axial, Coronal, Sagittal]}
  regions:
    - {id: chest, label: Chest}
    - {id: head, label: Head}
    - {id: abdomen, label: Abdomen}
    - {id: spine, label: Spine}
    - {id: extremity, label: Extremity}

# Worklist triage: a case is "urgent" when an analyzer reports one of these findings at high
# confidence (an AI flag that orders the queue, not a diagnosis).
triage:
  urgent_findings: [Pneumothorax, Effusion, Consolidation, Pneumonia, Edema, Fracture]

analyzers:
  - id: dicom_header
    class: app.analyzers.dicom:DicomConsistencyGate
    applies_to: [{}]

  - id: image_quality
    class: app.analyzers.quality:ImageQualityGate
    applies_to: [{modality: xray}]
    params:
      min_side_px: 256
      recommended_side_px: 512

  # Reconstruction error on the bundled samples: chest X-rays 0.034-0.045,
  # hand X-ray 0.068, colour photo 0.104.
  - id: chest_xray_ood
    class: app.analyzers.chest_xray.ood:AutoencoderOODGate
    applies_to: [{modality: xray, region: chest, views: [PA, AP]}]
    params:
      weights: 101-elastic
      warn_error: 0.050
      max_error: 0.060

  # Fraction of the analyzed square covered by each lung / the heart. Chest X-rays: lungs
  # 0.16-0.31 each, heart 0.10-0.21; non-chest images: ~0.
  - id: chest_xray_anatomy
    class: app.analyzers.chest_xray.anatomy:ChestAnatomySegmenter
    applies_to: [{modality: xray, region: chest, views: [PA, AP]}]
    params:
      min_lung_fraction: 0.05
      min_heart_fraction: 0.03
      max_cropped_fraction: 0.25

  # Scores are operating-point normalized: 0.5 is each model's calibrated threshold.
  # Findings at or above `report` are shown; below `moderate` they are marked uncertain.
  - id: chest_xray_pathology
    class: app.analyzers.chest_xray.pathology:PathologyEnsemble
    applies_to: [{modality: xray, region: chest, views: [PA, AP]}]
    params:
      models: [densenet121-res224-all, resnet50-res512-all]
      thresholds: {report: 0.50, moderate: 0.60, high: 0.70}
      explain_top_k: 3

  # --- Vision-language only (experimental) ------------------------------------------------
  # CT studies and MRI outside the head have no specialist model yet: the image goes only to
  # the vision-language assessment, with a visible "experimental" warning.
  - id: vision_language_only
    class: app.analyzers.vision_only:VisionLanguageOnly
    applies_to: [{modality: ct}, {modality: mri, region: chest}, {modality: mri, region: abdomen}, {modality: mri, region: spine}]

  # --- Extremity X-ray -------------------------------------------------------------------
  # Refuses chest radiographs submitted as extremity studies (reuses the chest anatomy model).
  - id: extremity_region_gate
    class: app.analyzers.extremity_xray.region_gate:NotChestGate
    applies_to: [{modality: xray, region: extremity}]
    params:
      max_lung_fraction: 0.05

  # YOLOv7-p6 trained on GRAZPEDWRI-DX (pediatric wrist trauma radiographs), GPL-3.0.
  # Scores are detection confidences. On the bundled samples: fractures 0.40-0.81, and one
  # false positive (0.52) on a normal hand, which is why lower scores stay "uncertain".
  - id: extremity_fracture
    class: app.analyzers.extremity_xray.fracture:FractureDetector
    applies_to: [{modality: xray, region: extremity, views: [PA, AP, Lateral]}]
    params:
      weights_url: https://github.com/mdciri/YOLOv7-Bone-Fracture-Detection/releases/download/trained-models/yolov7-p6-bonefracture.onnx
      thresholds: {report: 0.40, moderate: 0.55, high: 0.70}

  # --- Brain MRI -------------------------------------------------------------------------
  # Same rule-based gate as for X-rays (rejects colour photos, blank or tiny images); MRI
  # slices are often 256 px, so the resolution limits are lower.
  - id: brain_mri_quality
    class: app.analyzers.quality:ImageQualityGate
    applies_to: [{modality: mri, region: head}]
    params:
      min_side_px: 128
      recommended_side_px: 256

  # ViT-B/16 fine-tuned on 2D brain MRI slices (Hemg/Brain-Tumor-Classification, Apache-2.0),
  # four classes: glioma, meningioma, pituitary tumor, no tumor. The label set matches the
  # public Kaggle "Brain Tumor MRI Dataset" (mostly contrast-enhanced T1 slices; the card does
  # not name its data). One slice at a time, no localization; it cannot tell other lesions
  # from these classes. On the bundled samples: glioma 0.96, meningioma 0.95, pituitary 0.96,
  # normal "No tumor" 0.98; a T2-weighted glioblastoma scored as meningioma (0.81).
  - id: brain_mri_tumor
    class: app.analyzers.brain_mri.tumor:BrainTumorClassifier
    applies_to: [{modality: mri, region: head, views: [Axial, Coronal, Sagittal]}]
    params:
      weights_url: https://huggingface.co/Hemg/Brain-Tumor-Classification/resolve/4b71d94edf9803761d24020936eef6d4deac15ab/model.safetensors
      weights_file: brain-tumor-vit-b16.safetensors
      thresholds: {report: 0.50, moderate: 0.70, high: 0.90}
